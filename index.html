
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Best Friend 💖</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    overflow-x: hidden;
">

    <div style="
        width: 85%;
        max-width: 450px;
        padding: 30px 20px;
        text-align: center;
        background: rgba(255,255,255,0.88);
        border-radius: 25px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        margin: 20px;
    ">

        <div style="font-size: 60px;">🧸💗🌸</div>

        <h1 style="
            color: #ff4081;
            font-size: 32px;
            margin-bottom: 10px;
        ">Hey, My Best Friend! 💕</h1>

        <p style="font-size: 18px; color: #555;">
            You are not just my friend,
            you are a beautiful part of my life. 🥹❤️
        </p>

        <div style="
            font-size: 45px;
            margin: 20px 0;
        ">👭💞✨</div>

        <p style="
            color: #7b2d5b;
            font-size: 17px;
            line-height: 1.8;
        ">
            Thank you for being in my life. 🫶🏻<br>
            Your friendship makes my days brighter. ☀️<br>
            May your smile never fade,<br>
            and may your dreams come true. 🌷
        </p>

        <h2 style="color: #ff4081;">
            Love You, Bestie! 💖
        </h2>

        <button onclick="showSurprise()" style="
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 5px 15px #ffb6c1;
        ">
            Click for a Surprise 🎁
        </button>

        <p id="surprise" style="
            color: #e91e63;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
        "></p>

        <p style="color: #999; font-size: 13px; margin-top: 25px;">
            Made with ❤️ just for you
        </p>

    </div>

    <script>
        function showSurprise() {
            document.getElementById("surprise").innerHTML =
                "🎉 You are a gift in my life! 🎉<br>" +
                "No matter what happens, our friendship is special! 💗🥹💐";

            for (let i = 0; i < 12; i++) {
                let heart = document.createElement("div");

                heart.innerHTML = ["💖", "💕", "💗", "❤️", "✨"][
                    Math.floor(Math.random() * 5)
                ];

                heart.style.position = "fixed";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = Math.random() * 100 + "vh";
                heart.style.fontSize = "30px";
                heart.style.pointerEvents = "none";
                heart.style.zIndex = "9999";

                document.body.appendChild(heart);

                setTimeout(function () {
                    heart.remove();
                }, 2500);
            }
        }
    </script>

</body>
</html>
