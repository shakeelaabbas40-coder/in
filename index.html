<!DOCTYPE html>
<html>
<head>
    <title>Happy Friendship Day</title>
</head>

<body style="margin:0; padding:20px; font-family:Arial; background:linear-gradient(135deg, #c2e9fb, #fce4ec); text-align:center; min-height:100vh; box-sizing:border-box;">

    <div style="background:white; max-width:600px; margin:40px auto; padding:35px 20px; border-radius:20px; box-shadow:0 8px 25px rgba(0,0,0,0.15);">

        <h1 style="color:#ff6b6b; font-size:40px; margin-bottom:15px;">
            💖 Happy Friendship Day 💖
        </h1>

        <p style="font-size:18px; color:#555; line-height:1.6;">
            True friends are never apart,<br>
            maybe in distance but never in heart. ❤️
        </p>

        <div style="font-size:65px; margin:25px 0;">
            👭 🫂 👬
        </div>

        <h2 style="color:#6c63ff;">
            My Dear Friends! 🥰
        </h2>

        <p style="font-size:17px; color:#444; line-height:1.8;">
            Thank you for being a part of my life.<br>
            Your friendship means the world to me!<br>
            May our friendship last forever. 💕
        </p>

        <div style="background:#ff6b6b; color:white; padding:12px; border-radius:10px; margin-top:25px; font-size:20px;">
            🌸 Friends Forever 🌸
        </div>

        <p style="color:#888; margin-top:25px;">
            Made with ❤️ for my best friends!
        </p>

    </div>

</body>
</html>
